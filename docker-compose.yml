version: '3.8'

services:
  # ################################################
  # 1. El motor de nuestra Base de Datos
  # ################################################
  bbdd-plataforma:
    image: postgres:15-alpine
    container_name: postgres_deportivo
    restart: always
    environment:
      POSTGRES_DB: bbdd-plataforma
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456789
    ports:
      - "5432:5432"
    volumes:
      - data-deportiva:/var/lib/postgresql/data
    networks:
      - red-deportiva

  # ################################################
  # 2. Tu Microservicio de Autenticación (Backend)
  # ################################################
  auth-service:
    container_name: auth_service_container
    restart: always
    build:
      context: ./backend-services/auth_service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://bbdd-plataforma:5432/bbdd-plataforma
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=123456789
    depends_on:
      - bbdd-plataforma
    networks:
      - red-deportiva

  # ################################################
  # 3. Tu Aplicación Frontend (Vite / React)
  # ################################################
  frontend-service:
    container_name: frontend_deportivo_container
    restart: always
    build:
      context: ./frontend-apps/auth_service_front
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - auth-service
    networks:
      - red-deportiva

# Volúmenes para que los datos no se borren al apagar el contenedor
volumes:
  data-deportiva:

# Red interna para que los microservicios se hablen entre sí
networks:
  red-deportiva:
    driver: bridge