<div class="auth-card">
    <h2>Nuevo Registro</h2>
    <p>Únete a la plataforma completando tus datos</p>
    <form id="form-registro">
        <div class="form-group">
            <label>Nombre de Usuario</label>
            <input type="text" id="reg-username" required placeholder="Tu usuario">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="reg-email" required placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="reg-password" required placeholder="Mínimo 6 caracteres">
        </div>
        <button type="submit" class="btn-block">Crear Cuenta</button>
        <p id="reg-success" class="success-msg" style="display:none;"></p>
        <p id="reg-error" class="error-msg" style="display:none;"></p>
    </form>
</div>
